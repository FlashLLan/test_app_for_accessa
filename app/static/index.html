<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #ddddd8; --accent: #2f5d8a; --danger: #a33a2c; --card: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #181816; --fg: #ececea; --muted: #9a9a94; --line: #34342f; --accent: #7aa7d6; --danger: #e07a6b; --card: #22221f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 15px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    input, select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    input { flex: 1 1 120px; min-width: 0; }
    button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    button.delete { background: none; color: var(--danger); border-color: var(--line); padding: 2px 10px; }
    #sort-form { margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); padding: 12px 6px; }
    #status { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; }
    #status.error { color: var(--danger); }
  </style>
</head>
<body>
<main>
  <h1>Inventory</h1>
  <p class="sub">Demo app for testing a change-approval tool.</p>

  <section>
    <h2>Credentials for deleting</h2>
    <form id="creds" onsubmit="return false">
      <input id="token" type="password" placeholder="API token" autocomplete="off">
      <select id="role">
        <option value="admin">admin</option>
        <option value="viewer">viewer</option>
      </select>
    </form>
  </section>

  <section>
    <h2>Add item</h2>
    <form id="add-form">
      <input name="name" placeholder="Name" required>
      <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
      <input name="quantity" type="number" min="0" step="1" placeholder="Quantity" value="0">
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <h2>Items</h2>
    <form id="sort-form" onsubmit="return false">
      <select id="sort" onchange="loadItems()">
        <option value="name">Sort by name</option>
        <option value="price">Sort by price</option>
      </select>
      <select id="direction" onchange="loadItems()">
        <option value="0">Ascending</option>
        <option value="1">Descending</option>
      </select>
    </form>
    <table>
      <thead><tr><th>Name</th><th class="num">Price</th><th class="num">Quantity</th><th></th></tr></thead>
      <tbody id="items"></tbody>
    </table>
    <p id="status"></p>
  </section>
</main>
<script>
  const tbody = document.getElementById("items");
  const statusEl = document.getElementById("status");

  function setStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = isError ? "error" : "";
  }

  function cell(text, className) {
    const td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    return td;
  }

  async function loadItems() {
    const sort = document.getElementById("sort").value;
    const desc = document.getElementById("direction").value;
    const response = await fetch("/api/items?sort=" + sort + "&desc=" + desc);
    render(await response.json());
  }

  function render(items) {
    tbody.replaceChildren();
    if (items.length === 0) {
      const tr = document.createElement("tr");
      const td = cell("No items yet.", "empty");
      td.colSpan = 4;
      tr.append(td);
      tbody.append(tr);
      return;
    }
    for (const item of items) {
      const tr = document.createElement("tr");
      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "Delete";
      del.onclick = () => deleteItem(item.name);
      const actions = document.createElement("td");
      actions.className = "num";
      actions.append(del);
      tr.append(cell(item.name), cell(item.price.toFixed(2), "num"), cell(item.quantity, "num"), actions);
      tbody.append(tr);
    }
  }

  async function deleteItem(name) {
    const response = await fetch("/api/items/" + encodeURIComponent(name), {
      method: "DELETE",
      headers: {
        "X-API-Token": document.getElementById("token").value,
        "X-Role": document.getElementById("role").value,
      },
    });
    const body = await response.json();
    setStatus(response.ok ? "Deleted " + name : body.error, !response.ok);
    loadItems();
  }

  document.getElementById("add-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.target;
    const response = await fetch("/api/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: form.name.value.trim(),
        price: Number(form.price.value),
        quantity: Number(form.quantity.value || 0),
      }),
    });
    const body = await response.json();
    setStatus(response.ok ? "Added " + body.name : body.error, !response.ok);
    if (response.ok) form.reset();
    loadItems();
  });

  loadItems();
</script>
</body>
</html>
